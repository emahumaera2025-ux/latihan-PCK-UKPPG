const app = document.getElementById('app');
const timerPill = document.getElementById('timerPill');
const modePill  = document.getElementById('modePill');
const LETTERS = ['A','B','C','D','E'];
let S = null;
let chosenMode = 'exam';

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = sec => {
  sec = Math.max(0, sec);
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor(sec%3600/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
};

function isAnswered(q, a){
  if(a === undefined || a === null) return false;
  if(q.type === 'pg') return typeof a === 'number';
  if(q.type === 'kategori') return Array.isArray(a) && a.some(x => x !== null && x !== undefined);
  if(q.type === 'mcma') return Array.isArray(a) && a.length > 0;
  return false;
}
function scoreQ(q, a){
  if(!isAnswered(q,a)) return 0;
  if(q.type === 'pg') return a === q.ans ? 1 : 0;
  if(q.type === 'kategori'){
    let c=0; q.key.forEach((k,i)=>{ if(a[i]===k) c++; });
    return c / q.key.length;
  }
  if(q.type === 'mcma'){
    let hit=0, wrong=0;
    a.forEach(i => { if(q.ans.includes(i)) hit++; else wrong++; });
    return Math.max(0, (hit-wrong)/q.ans.length);
  }
  return 0;
}

/* ---------- START MENU ---------- */

  timerPill.textContent = '--:--:--';

  const cards = SIMULATIONS.map(sim=>`
    <button class="sim-card" data-sim="${sim.id}">
      <span class="sim-tag">${sim.name}</span>
      <h3>${sim.title}</h3>
      <p>${sim.subtitle}</p>
      <div class="meta">
        <span><b>${sim.questions.length}</b> soal</span>
        <span><b>${Math.round(sim.duration/60)}</b> menit</span>
      </div>
    </button>
  `).join('');

  app.innerHTML = `
  <div class="wrap">
    <div class="card hero">
      <span class="badge">SIMULASI LATIHAN MANDIRI</span>
      <h1>UKPPPG — 7 Paket Simulasi</h1>

    </div>

      <button class="mode-chip ${chosenMode==='exam'?'active':''}" data-mode="exam">⏱ Mode Ujian (timer)</button>

  document.querySelectorAll('[data-sim]').forEach(b=>{

/* ---------- BEGIN ---------- */
function begin(sim, mode){
  chosenMode = mode;
  S = {
    sim, mode,
    list: sim.questions,
    ans:{}, flags:{}, checked:{}, idx:0,
    submitted:false, timeLeft:sim.duration, timerId:null
  };
  modePill.textContent = `${sim.name} · ${mode==='exam'?'Ujian':'Latihan'} · ${sim.questions.length} soal`;
  if(mode === 'exam'){
    timerPill.classList.remove('warn');
    updateTimer();
    S.timerId = setInterval(()=>{
      S.timeLeft--;
      updateTimer();
      if(S.timeLeft <= 0){ clearInterval(S.timerId); submit(true); }
    }, 1000);
  } else {
    timerPill.textContent = '∞';
  }
  renderExam();
}

function updateTimer(){
  timerPill.textContent = fmt(S.timeLeft);
  timerPill.classList.toggle('warn', S.timeLeft <= 600);
}

/* ---------- RENDER EXAM ---------- */
function renderExam(){
  const q = S.list[S.idx];
  const a = S.ans[q.id];
  const doneCount = S.list.filter(x=>isAnswered(x, S.ans[x.id])).length;
  const checkedHere = !!S.checked[q.id];
  const showFb = (S.mode==='practice' && checkedHere) || S.submitted;

  let bodyHTML = '';

  if(q.type === 'pg'){
    bodyHTML = `<div class="opts">` + q.opts.map((o,i)=>{
      let cls = 'opt';
      if(showFb){
        if(i === q.ans) cls += ' correct';
        else if(a === i) cls += ' wrong';
      } else if(a === i) cls += ' sel';
      return `<button class="${cls}" data-opt="${i}">
        <div class="mark">${LETTERS[i]}</div><span class="txt">${esc(o)}</span></button>`;
    }).join('') + `</div>`;
  }

  if(q.type === 'mcma'){
    bodyHTML = `<div class="opts">` + q.opts.map((o,i)=>{
      const sel = Array.isArray(a) && a.includes(i);
      let cls = 'opt';
      if(showFb){
        if(q.ans.includes(i)) cls += ' correct';
        else if(sel) cls += ' wrong';
      } else if(sel) cls += ' sel';
      return `<button class="${cls}" data-opt="${i}">
        <div class="mark">${sel?'✓':''}</div><span class="txt"><b>${LETTERS[i]}.</b> ${esc(o)}</span></button>`;
    }).join('') + `</div>`;
  }

  if(q.type === 'kategori'){
    bodyHTML = `<div>` + q.stmts.map((st,si)=>{
      const val = Array.isArray(a) ? a[si] : null;
      const btns = q.labels.map((lb,li)=>{
        let cls = 'kbtn';
        if(showFb){
          if(li === q.key[si]) cls += ' correct';
          else if(val === li) cls += ' wrong';
        } else if(val === li) cls += ' sel';
        return `<button class="${cls}" data-stmt="${si}" data-label="${li}">${lb}</button>`;
      }).join('');
      return `<div class="stmt">
        <div class="s-text"><span class="s-idx">${si+1}.</span>${esc(st)}</div>
        <div class="kbtns">${btns}</div></div>`;
    }).join('') + `</div>`;
  }

  let fbHTML = '';
  if(showFb){
    const sc = scoreQ(q, a);
    let cls = sc === 1 ? 'ok' : (sc > 0 ? 'warn' : 'bad');
    let title = sc === 1 ? '✓ Jawaban Benar' : (sc > 0 ? '◐ Sebagian Benar' : '✗ Jawaban Belum Tepat');
    let keyTxt = '';
    if(q.type === 'pg') keyTxt = `Kunci: <b>${LETTERS[q.ans]}</b>. `;
    if(q.type === 'mcma') keyTxt = `Kunci: <b>${q.ans.map(i=>LETTERS[i]).join(', ')}</b>. `;
    if(q.type === 'kategori') keyTxt = `Kunci: <b>${q.key.map((k,i)=>`(${i+1}) ${q.labels[k]}`).join(' · ')}</b>. `;
    fbHTML = `<div class="fb ${cls}"><b>${title}</b>
      <div class="exp">${keyTxt}${esc(q.exp)}</div></div>`;
  }

  const navHTML = S.list.map((x,i)=>{
    const answered = isAnswered(x, S.ans[x.id]);
    let cls = 'nbtn';
    if(S.submitted){
      const sc = scoreQ(x, S.ans[x.id]);
      cls += sc === 1 ? ' ok' : (sc > 0 ? ' done' : ' no');
    } else if(answered) cls += ' done';
    if(S.flags[x.id]) cls += ' flag';
    if(i === S.idx) cls += ' cur';
    return `<button class="${cls}" data-go="${i}">${i+1}</button>`;
  }).join('');

  const sectionTag = q.section === 'PU' ? 'Pedagogi Umum' : (q.section === 'PCK' ? 'PCK Informatika' : q.section);
  const sectionCls = (q.section === 'PCK' || q.section === 'Profesional') ? 'pck' : 'pu';
  const typeLabel = q.type==='pg' ? 'Pilihan Ganda' : (q.type==='mcma' ? 'PGK MCMA' : 'PGK Kategori · ' + q.labels.join(' / '));

  app.innerHTML = `
  <div class="wrap">
    <div class="exam-grid">
      <div>
        <div class="card qcard">
          <div class="qmeta">
            <span class="tag ${sectionCls}">${sectionTag}</span>
            <span class="tag type">${typeLabel}</span>
            <span class="qnum">Soal ${S.idx+1} dari ${S.list.length}</span>
          </div>
          ${q.type==='kategori'
            ? `<div class="qtext">${esc(q.intro)}</div>`
            : `<div class="qtext">${esc(q.q)}</div>`}
          ${q.type==='mcma' ? `<div class="qsub">Pilih <b>semua</b> opsi yang benar — bisa lebih dari satu.</div>` : ''}
          ${bodyHTML}
          ${fbHTML}
        </div>
      </div>
      <aside class="card nav-panel">
        <div class="nav-title">Navigasi Soal</div>
        <div class="nav-grid">${navHTML}</div>
        <div class="legend">
          <div><span class="sw done"></span> Sudah dijawab</div>
          <div><span class="sw cur"></span> Soal aktif</div>
          <div><span class="sw flag"></span> Ditandai ragu</div>
        </div>
      </aside>
    </div>
  </div>
  <div class="bar">
    <div class="inner">
      <button class="btn" id="prevBtn" ${S.idx===0?'disabled':''}>← Sebelumnya</button>
      <button class="btn flagbtn ${S.flags[q.id]?'active':''}" id="flagBtn">⚑ Tandai Ragu</button>
      ${S.mode==='practice' && !S.submitted ? `<button class="btn solid" id="checkBtn">Cek Jawaban</button>` : ''}
      <button class="btn solid" id="nextBtn" ${S.idx===S.list.length-1?'disabled':''}>Berikutnya →</button>
      <span class="progress-mini">${doneCount}/${S.list.length} terjawab</span>
      <button class="btn submit" id="submitBtn">Selesai &amp; Lihat Hasil</button>
    </div>
  </div>`;

  bindExam(q);
}

function bindExam(q){
  const go = i => { S.idx = i; renderExam(); };
  document.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick = () => go(+b.dataset.go);
  });
  document.querySelectorAll('[data-opt]').forEach(b=>{
    b.onclick = () => {
      if(S.submitted) return;
      if(S.mode==='practice' && S.checked[q.id]) return;
      const i = +b.dataset.opt;
      if(q.type === 'pg'){
        S.ans[q.id] = i;
      } else {
        let cur = Array.isArray(S.ans[q.id]) ? [...S.ans[q.id]] : [];
        cur.includes(i) ? cur = cur.filter(x=>x!==i) : cur.push(i);
        S.ans[q.id] = cur;
      }
      renderExam();
    };
  });
  document.querySelectorAll('[data-stmt]').forEach(b=>{
    b.onclick = () => {
      if(S.submitted) return;
      if(S.mode==='practice' && S.checked[q.id]) return;
      const si = +b.dataset.stmt, li = +b.dataset.label;
      let arr = Array.isArray(S.ans[q.id]) ? [...S.ans[q.id]] : new Array(q.stmts.length).fill(null);
      arr[si] = li;
      S.ans[q.id] = arr;
      renderExam();
    };
  });
  $('#prevBtn').onclick = () => go(Math.max(0, S.idx-1));
  $('#nextBtn').onclick = () => go(Math.min(S.list.length-1, S.idx+1));
  $('#flagBtn').onclick = () => { S.flags[q.id] = !S.flags[q.id]; renderExam(); };
  const cb = $('#checkBtn');
  if(cb) cb.onclick = () => { S.checked[q.id] = true; renderExam(); };
  $('#submitBtn').onclick = () => {
    const unanswered = S.list.filter(x=>!isAnswered(x, S.ans[x.id])).length;
    if(unanswered > 0){
      if(!confirm(`Masih ada ${unanswered} soal belum dijawab. Tetap selesaikan?`)) return;
    } else {
      if(!confirm('Selesaikan simulasi dan lihat hasil?')) return;
    }
    submit(false);
  };
}

function submit(auto){
  if(S.submitted) return;
  S.submitted = true;
  if(S.timerId) clearInterval(S.timerId);
  if(auto) alert('Waktu habis! Jawaban otomatis dikumpulkan.');
  renderResult();
}

/* ---------- RESULT ---------- */
let filterMode = 'all';

function renderResult(){
  timerPill.textContent = S.mode==='exam' ? fmt(S.timeLeft) + ' tersisa' : 'Selesai';
  timerPill.classList.remove('warn');

  const total = S.list.length;
  const sum = S.list.reduce((t,q)=> t + scoreQ(q, S.ans[q.id]), 0);
  const pct = Math.round(sum/total*100);
  const full = S.list.filter(q => scoreQ(q, S.ans[q.id]) === 1).length;
  const partial = S.list.filter(q => { const s = scoreQ(q, S.ans[q.id]); return s > 0 && s < 1; }).length;
  const zero = total - full - partial;

  app.innerHTML = `
  <div class="wrap">
    <div class="card result-hero">
      <div class="score-circle" style="--pct:${pct}%">
        <div class="score-inner">
          <div class="num">${pct}%</div>
          <div class="lbl">Skor Total</div>
        </div>
      </div>
      <h1 style="font-size:20px;margin-bottom:6px">${S.sim.name} — ${S.sim.title}</h1>
      <p style="color:var(--muted);font-size:14px">
        ${sum.toFixed(1)} dari ${total} poin · ${full} benar penuh · ${partial} sebagian · ${zero} belum tepat
      </p>
    </div>
    <div class="stat-row" style="margin-top:18px">
      <div class="stat"><div class="v">${full}</div><div class="k">Benar Penuh</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${partial}</div><div class="k">Sebagian</div></div>
      <div class="stat"><div class="v" style="color:var(--bad)">${zero}</div><div class="k">Belum Tepat</div></div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="review-head">
        <h2>Pembahasan</h2>
        <div class="filters">
          <button class="fbtn active" data-f="all">Semua</button>
          <button class="fbtn" data-f="wrong">Perlu Diperbaiki</button>
        </div>
      </div>
      <div class="review-list" id="reviewList"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn solid" id="againBtn" style="flex:1;min-width:160px">Ulangi Simulasi Ini</button>
      <button class="btn" id="menuBtn" style="flex:1;min-width:160px">Kembali ke Menu</button>
    </div>
  </div>`;

  const renderList = () => {
    const list = S.list.filter(q=>{
      if(filterMode === 'all') return true;
      return scoreQ(q, S.ans[q.id]) < 1;
    });
    $('#reviewList').innerHTML = list.length ? list.map(q=>{
      const a = S.ans[q.id];
      const sc = scoreQ(q, a);
      const cardCls = sc===1 ? 'right-card' : (sc>0 ? 'partial-card' : 'wrong-card');
      const num = S.list.indexOf(q)+1;
      const tag = q.section === 'PU' ? 'PU' : (q.section === 'PCK' ? 'PCK' : q.section);
      let body = '';
      if(q.type === 'pg'){
        body = `<div class="ansbox">
          <div class="yours ${sc===1?'ok':'no'}"><span class="lbl">Jawaban Anda</span>${isAnswered(q,a)?LETTERS[a]+'. '+esc(q.opts[a]):'<i>tidak dijawab</i>'}</div>
          <div class="key"><span class="lbl">Kunci</span>${LETTERS[q.ans]}. ${esc(q.opts[q.ans])}</div>
        </div>`;
      }
      if(q.type === 'mcma'){
        const yours = (Array.isArray(a)&&a.length) ? a.map(i=>LETTERS[i]).join(', ') : 'tidak dijawab';
        body = `<div class="ansbox">
          <div class="yours ${sc===1?'ok':'no'}"><span class="lbl">Pilihan Anda</span>${yours}</div>
          <div class="key"><span class="lbl">Kunci</span>${q.ans.map(i=>LETTERS[i]).join(', ')}</div>
        </div>`;
      }
      if(q.type === 'kategori'){
        body = `<div class="ansbox">` + q.stmts.map((st,i)=>{
          const v = Array.isArray(a) ? a[i] : null;
          const ok = v === q.key[i];
          return `<div class="yours ${ok?'ok':'no'}" style="margin-bottom:6px">
            <span class="lbl">${i+1}</span>${esc(st)}<br>
            <span style="color:var(--muted);font-size:12.5px">Anda: <b>${v===null||v===undefined?'—':q.labels[v]}</b> · Kunci: <b>${q.labels[q.key[i]]}</b></span></div>`;
        }).join('') + `</div>`;
      }
      return `<div class="rev ${cardCls}">
        <div class="qmeta" style="margin-bottom:0">
          <span class="tag type">${tag}</span>
          <span class="tag type">${q.type==='pg'?'PG':(q.type==='mcma'?'PGK MCMA':'PGK Kategori')}</span>
          <span class="qnum">No. ${num} · skor ${sc.toFixed(2)}</span>
        </div>
        <div class="rq">${esc(q.type==='kategori' ? q.intro : q.q)}</div>
        ${body}
        <div class="fb ${sc===1?'ok':(sc>0?'warn':'bad')}" style="margin-top:0">
          <b>Pembahasan</b><div class="exp">${esc(q.exp)}</div></div>
      </div>`;
    }).join('') : `<p style="color:var(--muted);text-align:center;padding:24px">Tidak ada soal pada filter ini. 🎉</p>`;
  };
  renderList();
  document.querySelectorAll('[data-f]').forEach(b=>{
    b.onclick = () => {
      filterMode = b.dataset.f;
      document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active', x===b));
      renderList();
    };
  });
  $('#againBtn').onclick = () => begin(S.sim, S.mode);
  $('#menuBtn').onclick = () => renderStart();
  window.scrollTo(0,0);
}

/* ---------- KEYBOARD ---------- */
document.addEventListener('keydown', e=>{
  if(!S || S.submitted || !document.querySelector('.qcard')) return;
  const q = S.list[S.idx];
  if(e.key === 'ArrowLeft')  $('#prevBtn')?.click();
  if(e.key === 'ArrowRight') $('#nextBtn')?.click();
  if(q.type === 'pg' || q.type === 'mcma'){
    const i = LETTERS.indexOf(e.key.toUpperCase());
    if(i > -1 && i < q.opts.length) document.querySelector(`[data-opt="${i}"]`)?.click();
  }
});

renderStart();
</script>
</body>
</html>
